minimum_pre_commit_version: '4.7.0'
repos:
  - repo: local
    hooks:
      - id: gitleaks-staged
        name: Gitleaks（ステージ済み変更）
        entry: mise run secrets:staged
        language: system
        pass_filenames: false
        always_run: true
      - id: gofmt
        name: gofmt
        entry: mise exec -- gofmt -w
        language: system
        types: [go]
      - id: actionlint
        name: actionlint + ShellCheck
        entry: mise exec -- actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        types: [yaml]
      - id: zizmor
        name: zizmor
        entry: mise exec -- zizmor --offline --strict-collection --no-progress
        language: system
        files: ^(\.github/workflows/.*\.ya?ml|\.pre-commit-config\.yaml)$
        types: [yaml]
