name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  hooks:
    name: コミット前チェック
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - run: mise run hooks

  secrets:
    name: Gitleaks
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install_args: gitleaks
      - name: 全Git履歴の秘密情報を検査
        run: mise run secrets

  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - run: mise run check
      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1.7.3
        id: chrome
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: PDF・PNGのブラウザ統合テスト
        env:
          REPORT_TEST_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: mise exec -- go test ./internal/report -run 'TestExportBrowser|TestCalendarInteractionBrowser' -v
      - name: 架空サンプルでCLIの出力を確認
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: >-
          mise exec -- go run ./cmd/fuchu-kids-event-curator
          -input examples/events.json -from 2026-11-01
          -output output/sample -export
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sample-report
          path: output/sample/
          retention-days: 7
