name: イベント一覧を生成する

on:
  workflow_dispatch:
    inputs:
      days:
        description: 掲載日数
        default: '30'
        required: true
      age_months:
        description: 子供の月齢
        default: '32'
        required: true
  schedule:
    # 毎月1日・15日 09:17 JST（月2回。14日間隔ではない）
    - cron: '17 0 1,15 * *'

permissions:
  contents: read

concurrency:
  group: curate-events
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: 日本語フォントを準備
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: 収集と配布用ファイルの生成
        env:
          REPORT_DAYS: ${{ inputs.days || '30' }}
          REPORT_AGE: ${{ inputs.age_months || '32' }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: >-
          mise exec -- go run ./cmd/fuchu-kids-event-curator
          -config config.example.json
          -days "$REPORT_DAYS" -age-months "$REPORT_AGE"
          -output output -export
      - name: 成果物を保存（部分失敗時も取得状況を残す）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuchu-kids-events-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
